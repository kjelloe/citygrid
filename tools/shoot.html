<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>City Grid — headless render</title>
<script type="importmap">
{ "imports": { "three": "../vendor/three.module.js" } }
</script>
<style>
  html, body { margin: 0; background: #9fc7de; }
  #city { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="city"></canvas>
<script type="module">
// Builds a real city with the real engine, then renders it with the real
// renderer. No fixtures and no mock state: a screenshot of something the
// simulation did not actually produce would be worth nothing.
import * as THREE from "three";
import { buildingVariants, VARIANTS } from "../client/render/building-kit.js";
import { CIVIC_DEFS } from "../client/world/civic-spec.js";
import { generateWorld } from "../engine/worldgen.js";
import { defaultOptions } from "../engine/options.js";
import { apply } from "../engine/reducer.js";
import { makeDeputy, deputyTurn } from "../engine/deputy.js";
import { CMD_JOIN, CMD_TICK, CMD_PLACE_ROAD, CMD_PLACE_RAIL, CMD_PLACE_BUILDING } from "../engine/commands.js";
import { definition } from "../engine/catalogue.js";
import { phaseForPreset } from "../client/world/rush.js";
import { TICKS_PER_YEAR } from "../engine/constants.js";
import "../engine/build-commands.js";
import "../engine/development.js";
import "../engine/utilities.js";
import "../engine/economy.js";
import "../engine/civic.js";
import "../engine/fire.js";
import "../engine/disasters.js";
import "../engine/traffic.js";
import "../engine/history.js";
// The fixture every OTHER gate measures on. A deputy-built city is sparse —
// 89 buildings on a 48-tile map — and a slice about crowds cannot be looked at
// on a city with nobody in it (slice E7).
import { saturatedCity } from "./lib/saturated.mjs";
import { getConfig, setConfig } from "../client/world/config.js";
import { createRenderer } from "../client/render/scene.js";
import { setYawStep, zoomBy, focusOn, pitchBy, applyPose } from "../client/render/camera.js";

const params = new URLSearchParams(location.search);
const seed = Number(params.get("seed") ?? 1003);
const years = Number(params.get("years") ?? 20);
const span = Number(params.get("span") ?? 0);
const yaw = Number(params.get("yaw") ?? 0);
// Degrees. The default is the camera's own start; a slope gate wants a low one,
// because relief seen from directly above is not relief (slice V4).
const pitchDeg = Number(params.get("pitch") ?? 0);

const canvas = document.getElementById("city");
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const size = Number(params.get("size") ?? 64);
const seats = Number(params.get("seats") ?? 1);
// `terrain` and `overlay` so the slope gate can shoot a hillside with every
// overlay on (slice V4).
const terrainStyle = params.get("terrain") ?? "rolling";
const overlay = params.get("overlay") ?? "";
// `dense=1` builds the saturated fixture instead: a grid every four tiles with
// zoning between it and four hundred ticks of growth.
const dense = params.get("dense") === "1";
let state;
if (dense) {
  // `rail=0` builds the fixture without its line (T3). A lever, because the
  // cost of the track is a before-and-after and the "before" has to be the
  // code that ships rather than a number that sounds like it.
  state = saturatedCity({ size, seed, ticks: years * TICKS_PER_YEAR, rail: params.get("rail") !== "0" }).state;
} else {
  const world = generateWorld(defaultOptions({ seed, width: size, height: size, seats, waterStyle: "river", terrainStyle }));
  if (!world.ok) throw new Error("generation failed: " + world.reason);
  state = world.state;

  const deputies = [];
  for (let s2 = 1; s2 <= seats; s2 += 1) {
    apply(state, { type: CMD_JOIN, actor: s2, seat: s2, name: `Deputy ${s2}` });
    deputies.push(makeDeputy(s2, "expand"));
  }
  for (let tick = 1; tick <= years * TICKS_PER_YEAR; tick += 1) {
    apply(state, { type: CMD_TICK });
    if (tick % 6 === 0) for (const d of deputies) deputyTurn(state, d);
  }
}

// `place=<def>[,<def>…]` builds a road across the middle and puts one of each
// definition beside it, through the REDUCER (slice S1). A picture of a building
// the rules refused is a picture of nothing, and the gate for twelve civic kits
// is twelve pictures — so the harness has to be able to put one in front of the
// camera before the camera is placed.
//
// `age=<ticks>` then backdates every building's `builtTick` by that many ticks,
// which is how B2's three ages are photographed: a site, a finished building
// and a derelict one are the same record at three numbers.
// `rank=<n>` grants the region's mayoral rank before anything is placed (T5a).
// `unlock` is a rule in the reducer now, so the harness cannot photograph a city
// hall or an airport at rank 0 — it gets `result: "locked"` and a picture of an
// empty road. Written the way a quest reward writes it, because that is the only
// thing that writes it in the game. NOT a switch `index.html` has: the rank is
// hashed state, and a URL that writes hashed state is a desync in a room.
const wantRank = Number(params.get("rank") ?? 0);
if (wantRank > 0) {
  const vars = state.quests.vars;
  const found = vars.find((v) => v.name === "rank");
  if (found) found.value = wantRank;
  else vars.push({ name: "rank", value: wantRank });
  vars.sort((a, b) => (a.name < b.name ? -1 : a.name > b.name ? 1 : 0));
}

const placeList = (params.get("place") ?? "").split(",").filter(Boolean);
const placed = [];
if (placeList.length > 0) {
  const W = state.width;
  const row = Math.round(W / 2);
  state.players[0].treasury = 9000000;
  // One command per CLEAR stretch, not one across the whole map. Since G1 a
  // network refuses a building and a run that crosses one is refused whole — so
  // a single house the deputy had put on the row refused the entire road, and
  // the park was photographed beside a field with "ok" in the log (the shot
  // reported `park:ok@5,33` and the aiming step found no street to stand on).
  //
  // Water breaks a stretch too since S13, for the road: a run that spans more
  // than `build.bridgeSpan` tiles of it is refused whole (ruling 047), and a
  // row through the middle of a river map crosses twenty-odd. The road stops at
  // the bank, which is also what a shot wants — a street to stand on.
  const laneRuns = (type, y, dryOnly = false) => {
    let start = -1;
    for (let x = 3; x <= W - 3; x += 1) {
      const terrain = state.tiles.terrain[y * W + x];
      const wet = dryOnly && (terrain === 3 || terrain === 4);
      const clear = x < W - 3 && !wet && state.tiles.buildingId[y * W + x] === 0;
      if (clear && start < 0) start = x;
      if (!clear && start >= 0) {
        apply(state, { type, actor: 1, runs: [y * W + start, x - start] });
        start = -1;
      }
    }
  };
  laneRuns(CMD_PLACE_ROAD, row, true);
  // A LINE two rows north of the road, so a definition with `needsRail` has
  // something to stand on. The rail station has never had a picture: the
  // harness laid a road and nothing else, so `placeBuilding` answered `invalid`
  // every time and printed it where nobody looked (P94).
  laneRuns(CMD_PLACE_RAIL, row - 3);
  let at = 5;
  for (const def of placeList) {
    const d = definition(def);
    if (!d) throw new Error("no such definition: " + def);
    // Set back by its own SIZE. At 20 m a tile, a fixed gap frames a water
    // tower and a hospital completely differently: two tiles put a 1×1 at the
    // far end of the shot and one tile put a 3×3 wall across the whole frame.
    // Back by (w - 1) keeps every definition about the same size in it.
    const y = row + 1 + Math.max(0, d.w - 1);
    // ALONG the row until the reducer accepts it. The cursor was fixed, and
    // since T2 put rock on this map the tile beside the road at x = 5 on seed
    // 1003 is rock — so every 1×1 definition has been photographed as an empty
    // road with `invalid` in a log nobody read (park, windTurbine, and T7's
    // clinic, which is how it was found).
    //
    // And over SEVERAL rows, not one: a surface pump needs a shore and a rail
    // station needs the line, so a single row of a seed is not enough ground to
    // satisfy every placement rule the catalogue has. The rows run outward from
    // the road so the nearest fit wins and the camera has the least distance to
    // cover.
    let result = "invalid";
    let fx = at;
    let fy = y;
    const rows = [y, row - 2, y + 1, y + 2, row - 4, y + 3];
    for (const ry of rows) {
      for (let rx = at; rx < W - d.w - 2; rx += 1) {
        result = apply(state, { type: CMD_PLACE_BUILDING, actor: 1, def, x: rx, y: ry }).result;
        if (result === "ok") { fx = rx; fy = ry; break; }
      }
      if (result === "ok") break;
    }
    placed.push({ def, x: fx, y: fy, w: d.w, h: d.h, result });
    at = fx + d.w + 2;
  }
}
// `placeAt=<def>@x,y[;<def>@x,y]` puts one definition on a GIVEN tile, through
// the reducer (T4b). `place=` builds its own road across the middle of the map
// and lines buildings up beside it, which cannot photograph anything that has
// to stand somewhere particular — a freight port needs a shore, and the shore
// is wherever this seed put the water.
for (const entry of (params.get("placeAt") ?? "").split(";").filter(Boolean)) {
  const [def, where] = entry.split("@");
  const [px, py] = where.split(",").map(Number);
  state.players[0].treasury = 9000000;
  const result = apply(state, { type: CMD_PLACE_BUILDING, actor: 1, def, x: px, y: py }).result;
  placed.push({ def, x: px, y: py, result });
}

const backdate = Number(params.get("age") ?? 0);
if (backdate !== 0) for (const b of state.buildings) b.builtTick -= backdate;
const wear = Number(params.get("wear") ?? -1);
if (wear >= 0) for (const b of state.buildings) b.condition = wear;

// `pollute` fills the pollution layer with one value, which puts the WHOLE map
// in one overlay band without changing a single thing that is drawn (slice V7).
// Three shots at three values then differ only in the wash, which is what makes
// "are the bands still told apart once the ground shades them" measurable.
const pollute = Number(params.get("pollute") ?? -1);
if (pollute >= 0) state.tiles.pollution.fill(pollute);

// `damage=burn|ruin|both` sets fire to the middle of the town, or burns it out
// (slice B1b). The engine's own states, written the way `engine/fire.js` writes
// them — the TILE flags — because that is what the renderer reads and what a
// building record has never carried. Without this a shot of damage needs a city
// that happens to be alight, which is a city nobody can aim at.
// `police=1` puts a police station on the first clear ground beside a road near
// the middle (B3b). The deputy builds fire stations since B1a and has never
// built a police station, so a patrol cannot exist in a played city at all —
// Q111. A shot of the thing has to place one.
if (params.get("police") === "1") {
  const W = state.width;
  const road = (x, y) => x >= 0 && y >= 0 && x < W && y < state.height && (state.tiles.road[y * W + x] & 16) !== 0;
  const clear = (x, y) => x >= 0 && y >= 0 && x + 1 < W && y + 1 < state.height
    && [[0, 0], [1, 0], [0, 1], [1, 1]].every(([dx, dy]) =>
      state.tiles.buildingId[(y + dy) * W + x + dx] === 0 && !road(x + dx, y + dy));
  let best;
  for (let y = 2; y < state.height - 3; y += 1) {
    for (let x = 2; x < W - 3; x += 1) {
      if (!clear(x, y)) continue;
      if (![[x - 1, y], [x + 2, y], [x, y - 1], [x, y + 2]].some(([rx, ry]) => road(rx, ry))) continue;
      const d = Math.hypot(x - W / 2, y - state.height / 2);
      if (!best || d < best.d) best = { d, x, y };
    }
  }
  if (best) {
    const id = 9100;
    state.buildings.push({ id, def: "policeStation", zone: 0, x: best.x, y: best.y, w: 2, h: 2,
      level: 1, occupancy: 0, condition: 100, owner: 1, flags: 0, builtTick: 0 });
    for (let dy = 0; dy < 2; dy += 1) {
      for (let dx = 0; dx < 2; dx += 1) state.tiles.buildingId[(best.y + dy) * W + best.x + dx] = id;
    }
    // Something for it to patrol: crime is a tile layer, and a fixture with
    // none sends the car nowhere.
    for (let y = Math.max(0, best.y - 8); y < Math.min(state.height, best.y + 8); y += 1) {
      for (let x = Math.max(0, best.x - 8); x < Math.min(W, best.x + 8); x += 1) {
        if (road(x, y)) state.tiles.crime[y * W + x] = 60 + ((x * 7 + y * 13) % 120);
      }
    }
    globalThis.SHOT_POLICE = { x: best.x, y: best.y };
  }
}

// `sick=1` raises `healthRisk` on a block beside the middle, so an ambulance
// has somewhere to go (B12). The deputy DOES build clinics — ten on a played 96
// — so unlike the police station this does not have to place the answerer; what
// a played city never has is the call, because `healthRisk` peaks at 29 of 255
// and the engine's own threshold for a call is 18.
if (params.get("sick") === "1") {
  const W = state.width;
  const clinic = state.buildings.find((b) => b.def === "clinic" || b.def === "hospital");
  if (clinic) {
    // Near the clinic, so the ambulance's errand is short enough to be in one
    // frame with it — and on ROAD tiles, because an errand aims at a place a
    // vehicle can drive to.
    let placed = 0;
    for (let r = 3; r <= 10 && placed === 0; r += 1) {
      for (let dy = -r; dy <= r && placed === 0; dy += 1) {
        for (let dx = -r; dx <= r && placed === 0; dx += 1) {
          const x = Math.round(clinic.x + dx);
          const y = Math.round(clinic.y + dy);
          if (x < 1 || y < 1 || x >= W - 1 || y >= state.height - 1) continue;
          if ((state.tiles.road[y * W + x] & 16) === 0) continue;
          for (let j = -1; j <= 1; j += 1) {
            for (let i = -1; i <= 1; i += 1) {
              const tx = x + i;
              const ty = y + j;
              if (tx < 0 || ty < 0 || tx >= W || ty >= state.height) continue;
              state.tiles.healthRisk[ty * W + tx] = 40;
            }
          }
          globalThis.SHOT_SICK = { x, y, clinic: clinic.id };
          placed = 1;
        }
      }
    }
  }
}

const damage = params.get("damage") ?? "";
if (damage) {
  const BURNING = 4;
  const RUINED = 8;
  // ZONED lots only. The three nearest buildings to the middle of a played
  // city included a fire station (T2's re-grown seed 1003 put one at 34,36
  // beside the house at 33,36), so the harness set fire to the responder:
  // `firesIn` joins the two burning footprints into one fire centred on the
  // station, `dispatch` sends that station to itself, and `service_shots`
  // reported "engines is 0" about a renderer that was working. A fire takes
  // houses, shops and factories; the instrument has to do the same.
  const zoned = state.buildings.filter((b) => b.zone !== 0);
  const middle = [...(zoned.length >= 3 ? zoned : state.buildings)]
    .sort((a, b) => Math.hypot(a.x - state.width / 2, a.y - state.height / 2)
      - Math.hypot(b.x - state.width / 2, b.y - state.height / 2));
  const alight = [];
  const burnt = [];
  for (const b of middle) {
    const wantBurn = damage !== "ruin" && alight.length < 3;
    const wantRuin = damage !== "burn" && burnt.length < 3;
    if (!wantBurn && !wantRuin) break;
    const target = wantBurn ? alight : burnt;
    const flag = wantBurn ? BURNING : RUINED;
    for (let dy = 0; dy < b.h; dy += 1) {
      for (let dx = 0; dx < b.w; dx += 1) {
        state.tiles.flags[(b.y + dy) * state.width + b.x + dx] |= flag;
      }
    }
    target.push(b);
    // A ruin has no building on it: the fire removes it and leaves the ground
    // flagged, so a shot that leaves the house standing is not a ruin at all.
    if (!wantBurn) {
      for (let dy = 0; dy < b.h; dy += 1) {
        for (let dx = 0; dx < b.w; dx += 1) state.tiles.buildingId[(b.y + dy) * state.width + b.x + dx] = 0;
      }
      state.buildings.splice(state.buildings.indexOf(b), 1);
    }
  }
  // BOTH places, because they are different buildings: a shot aimed at the
  // ruin has the fire off screen, which is how the first run of
  // `disaster_shot.mjs` photographed eighteen puffs of smoke nobody could see.
  const spot = (b) => (b ? { x: b.x, y: b.y } : undefined);
  globalThis.SHOT_DAMAGE = {
    burning: alight.length, ruined: burnt.length,
    at: spot(burnt[0] ?? alight[0]), fire: spot(alight[0]), ruin: spot(burnt[0]),
  };
}
// `sand=1` turns every dry tile to sand AFTER the city is grown, so the streets
// are where they were and the ground under them is not grass. The verge takes
// the ground's own colour (slice V7, A38) and green grass beside a road through
// a desert is exactly the bug that answer was written for.
if (params.get("sand") === "1") {
  for (let i = 0; i < state.tiles.terrain.length; i += 1) {
    const t = state.tiles.terrain[i];
    if (t !== 3 && t !== 4) state.tiles.terrain[i] = 6;
  }
}

// `relief=` overrides `reliefM` (ruling 038), so the two halves of a decision
// about how tall a hill should be can be shot from one harness (slice R3, A42).
const reliefParam = Number(params.get("relief") ?? 0);
if (reliefParam > 0) setConfig({ ...getConfig(), reliefM: reliefParam });
// `grade=0` is the street as it was before R3: the land under it. Anything else
// overrides `road.maxGrade`, so a decision about how steep a street may be can
// be shot rather than argued (A42).
// `wall=0` turns the retaining facing off (S18): the before and the after of a
// picture decision come out of ONE harness, or they are two cities.
const wallParam = params.get("wall");
if (wallParam === "0") {
  const cfg0 = getConfig();
  setConfig({ ...cfg0, road: { ...cfg0.road, wallMinDrop: Infinity } });
}

// `ladder=0` draws every trade lot as the one mass it was before S16a, so a
// parade of shops and the slab it replaced are the same city photographed twice.
const ladderParam = params.get("ladder");
if (ladderParam === "0") {
  const cfg0 = getConfig();
  setConfig({ ...cfg0, lot: { ...cfg0.lot, ladder: false } });
}

const gradeParam = params.get("grade");
if (gradeParam !== null) {
  const cfg0 = getConfig();
  setConfig({ ...cfg0, road: { ...cfg0.road, maxGrade: Number(gradeParam) } });
}

// `traffic=N` sets the engine's commuter load on every paved tile. The
// saturated fixture pushes its buildings in directly and never runs a commuter
// pass, so it has no cars at all — and a shot of a traffic change with no
// traffic in it is the shape of instrument failure this project keeps finding
// (slice R4).
const trafficLoad = Number(params.get("traffic") ?? -1);
if (trafficLoad >= 0) {
  for (let i = 0; i < state.tiles.road.length; i += 1) {
    if (state.tiles.road[i] & 16) state.tiles.traffic[i] = trafficLoad;
  }
}

const style = params.get("style") ?? "plain";
// `tier` so the harness can shoot what each quality setting actually draws
// (slice V2). `pixelRatio` stays pinned at 1 whatever the tier says, or two
// shots of the same city would differ in size rather than in detail.
const tier = params.get("tier") ?? "high";
// `life=0` freezes the traffic where it settled, so two shots of one city are
// the same picture (slice V1).
const life = params.get("life") === "1";
// `mode=ortho|city` so the review can diff the orthographic picture before and
// after V5 and see that it did not move.
const mode = params.get("mode") ?? "ortho";
// `time=day|sunset|night` (slice E6). The hour is a preset, and the shot takes
// it at once rather than fading in — `frames` then settles the cache.
const time = params.get("time") ?? "day";
// `post=0` turns the style's post pass off without changing anything else,
// which is how the ink is shown to be a finish rather than the style (P2).
const view = createRenderer(canvas, state, { pixelRatio: 1, preserveDrawingBuffer: true, style, tier, life, mode, time, post: params.get("post") !== "0",
  // `trees=0`: no countryside, for a portrait of a building (S20d). The BAKE
  // needs it as well as the draw call, which is why it is a renderer option and
  // not only a draw option.
  trees: params.get("trees") !== "0",
  // `hour=` also decides the hour a FROZEN city settles at (B4): `life=0`
  // settles once, before any frame has said what time it is.
  phase: params.has("hour") ? Number(params.get("hour")) : undefined });
setYawStep(view.view, yaw);
if (pitchDeg > 0) pitchBy(view.view, pitchDeg * (Math.PI / 180) - view.view.pitch);
if (span > 0) {
  view.view.span = span;
  zoomBy(view.view, 1);
}
// Frame where the city actually is, rather than the middle of the map — the
// deputy often builds off-centre and a screenshot of empty fields proves
// nothing.
const focusX = Number(params.get("fx") ?? -1);
const focusY = Number(params.get("fy") ?? -1);
if (focusX >= 0 && focusY >= 0) {
  focusOn(view.view, focusX, focusY);
} else if (state.buildings.length > 0) {
  let sx = 0; let sy = 0; let n = 0;
  for (const b of state.buildings) {
    if (b.zone === 0) continue;
    sx += b.x; sy += b.y; n += 1;
  }
  if (n > 0) focusOn(view.view, sx / n, sy / n);
}
// The PHOTO camera (F1), put exactly where a shot needs it:
// `photo=<x>,<z>[,<eye metres>[,<yaw radians>[,<pitch degrees>]]]`, in TILES.
//
// There is no walker, no pavement and no corridor to stand on, which is the
// whole point (A128): a street camera beside a steep shoulder stands inside the
// embankment, and a city camera cannot bake street geometry at all. This one
// stands three metres off the face at eye height and looks back at it.
const photoAt = params.get("photo");
if (photoAt) {
  const [px, pz, eyeM = 1.7, pyaw = 0, pPitch = 0] = photoAt.split(",").map(Number);
  focusOn(view.view, px, pz);
  view.enterPhoto();
  // The scene is in TILES and `heightAt` answers metres, which is the one
  // conversion this block exists to get right.
  // Above the SURFACE, which over water is the water (S18): a camera three
  // metres off a quay stands on the river, and one metre above the bed is one
  // metre under the river.
  const atX = px * view.model.tileM;
  const atZ = pz * view.model.tileM;
  const groundM = view.model.waterLevelAt?.(atX, atZ) ?? view.model.heightAt(atX, atZ);
  view.view.eye = { x: px, y: (groundM + eyeM) / view.model.tileM, z: pz };
  view.view.yaw = pyaw;
  view.view.pitch = pPitch * (Math.PI / 180);
  applyPose(view.view);
}

// Street mode (slice E4): `street=x,z` drops the walker at a tile and looks
// along `yaw`. The camera is the walker, so the shot is what a player sees.
const streetAt = params.get("street");
if (streetAt) {
  const [sx, sz] = streetAt.split(",").map(Number);
  if (!view.enterStreet(sx, sz)) throw new Error("no street to stand on");
  view.walker.look(yaw * (Math.PI / 2) - view.walker.pose.yaw, pitchDeg * (Math.PI / 180));
}
const reduced = params.get("reduced") === "1";
const budgetParam = Number(params.get("budget") ?? 0);
// `streetChunks` so the L3 gate can shoot the baked street without needing the
// High tier's full budget (slice E3).
const streetChunks = Number(params.get("streets") ?? -1);
// The street cache bakes one chunk a frame, so a one-frame shot of an L3 city
// shows a city with one chunk of street in it (slice E3).
const frames = Number(params.get("frames") ?? 1);
const drawOptions = {
  // The hour the ROAD keeps (B4). `hour=` overrides it as a number for a shot
  // that wants a rush; otherwise it follows the `time=` preset, so a night
  // screenshot has night traffic on it rather than a midday road under a dark
  // sky.
  dayPhase: params.has("hour") ? Number(params.get("hour")) : phaseForPreset(time),
  // `crowd=magenta` paints everybody magenta (B7, E7's trick): a crowd that
  // is drawn and cannot be seen is a question a picture answers in one shot.
  crowdColour: params.get("crowd") === "magenta" ? 0xff00ff : undefined,
  streetChunks: streetChunks >= 0 ? streetChunks : undefined,
  // `trees=0` takes the countryside out of a PORTRAIT (S20d). A civic shot
  // stands thirty to sixty metres off a definition, and on a rolling 48 the
  // wood between is the picture: the airport came back as five trunks and a
  // grey smudge. The building is the subject; the forest is the noise.
  props: !reduced, trees: !reduced && params.get("trees") !== "0",
  // `shadows=0` to tell a toon ramp's banding apart from a cast shadow.
  shadows: params.get("shadows") !== "0",
  budget: budgetParam > 0 ? budgetParam : undefined,
  overlay: overlay || undefined,
  // `territory=1` paints every building in its owner's colour (slice V7, A44).
  // The baked chunks honour it too now, so this is the shot that shows the near
  // half of the city agreeing with the far half.
  territory: params.get("territory") === "1",
};
let stats;
// **`life=1` needs a delta or it is `life=0` with extra steps.** `client/life/`
// takes its time from the caller (ruling 037), and this loop passed neither
// `dt` nor `frameMs` — so every screenshot this harness has ever taken had no
// moving car and nobody on the pavement, `life=1` included. Found in D4, when
// the compare sheet came back empty beside a reference full of vehicles.
//
// `frameMs` is 16 whatever the clock really says: the governor must stay idle
// for a shot, or a slow software rasteriser degrades the picture we are trying
// to look at, and the picture would be of the governor.
// `plane=<seconds>` winds the aircraft forward before the first frame (T5b).
// Its cycle is about a minute and a frame is 1/60 s, so photographing a landing
// by DRAWING up to it is three thousand frames; the flight is a pure function
// of its own clock, so one big step lands exactly where a thousand small ones
// would. Nothing else in `client/life/` is touched by it.
const planeAt = Number(params.get("plane") ?? 0);
if (planeAt > 0) view.planes?.update(planeAt);
const step = life ? { dt: 1 / 60, frameMs: 16 } : {};
for (let f = 0; f < frames; f += 1) stats = view.draw({ ...drawOptions, ...step, now: f * 16 });

// And then until the street cache has nothing left to build.
//
// It bakes with a WALL-CLOCK slice (R5: one phase a frame, `LOT_SLICE_MS`), so
// how much of a city exists after N frames depends on how fast the machine was
// for those N frames. That is how two `life=0` screenshots of one frozen city
// came back with different bytes — 5,707 pixels of it, all in the band where
// the far chunks were still arriving — and the frozen check in `motion_shots`
// had been passing only because the bake happened to finish inside its thirty.
//
// Time does NOT advance while it settles: `now` stays where the last frame left
// it and `dt` is zero, so the motion pose, the clock and the traffic are exactly
// what the caller asked for and only the geometry catches up. A one-frame shot
// is left alone: that is a caller asking for one frame.
let settleFrames = 0;
if (frames > 1) {
  const held = { ...drawOptions, ...step, dt: 0, now: (frames - 1) * 16 };
  while (settleFrames < 600 && (stats?.streets?.built ?? 0) > 0) {
    stats = view.draw(held);
    settleFrames += 1;
  }
}

const firstChunk = view.terrain.chunks[0];
const pos = firstChunk.mesh.geometry.getAttribute("position");
globalThis.SHOT_REPORT = {
  style,
  seed, years,
  population: state.population,
  buildings: state.buildings.length,
  chunksRebuilt: stats.chunksRebuilt,
  corridors: stats.corridors,
  lots: stats.lots,
  instances: stats.instances,
  // From the STATS, not from `renderer.info`: with a post pass the counter has
  // been reset by the full-screen quad by the time this runs, and every shot of
  // a post-processed style has reported "1 draw, 2 triangles" (P2).
  drawCalls: stats.drawCalls ?? view.renderer.info.render.calls,
  triangles: stats.triangles ?? view.renderer.info.render.triangles,
  lod: stats.lod,
  tilePixels: stats.tilePixels,
  budget: stats.budget,
  chunkPlans: stats.chunkPlans,
  chunkTiers: stats.chunkTiers,
  streets: stats.streets,
  time: stats.time,
  night: stats.night,
  lamps: stats.lamps,
  peds: stats.peds,
  pedsHeld: stats.pedsHeld,
  nav: stats.nav,
  lampsHeld: stats.lampsHeld,
  cars: stats.cars,
  variants: VARIANTS,
  // Civic is keyed by DEFINITION since S1, so its pool count is the
  // catalogue's, not the six hashed variants every other category has.
  civicDefs: CIVIC_DEFS.length,
  // How many of the garden pools were actually placed (slice V6). A pool that
  // is silently empty looks exactly like a pool whose conditions were not met,
  // which is the lesson E6 paid for.
  garden: { lawn: view.pools.lawn?.count ?? -1, hedge: view.pools.hedge?.count ?? -1, path: view.pools.path?.count ?? -1 },
  mode,
  relief: getConfig().reliefM,
  maxGrade: getConfig().road.maxGrade,
  spanUsed: view.view.span,
  // `<def>:<result>@<x>,<y>`, because `place=` walks along the row until the
  // reducer accepts a spot (T7) and a tool that wants to point a camera at what
  // it asked for has to be told where that ended up. Every existing reader
  // tests with `includes("<def>:ok")`, which still holds.
  placed: placed.map((p) => `${p.def}:${p.result}@${p.x},${p.y}`).join(" ") || undefined,
  maxH: view.model.maxHeight,
  steepestStreet: view.model.steepestStreet,
  // Every category's variants, as triangle counts (slice V6). A variant the kit
  // does not build comes out identical to another, which is a city of clones
  // and a green suite; node cannot see this because `building-kit.js` imports
  // three.
  kit: (() => {
    const out = {};
    for (const kind of ["residential", "commercial", "industrial", "civic"]) {
      // `{ walls, roof }` per variant — the roof is its own geometry so it can
      // take the roof colour.
      // A hash of the POSITIONS, not a triangle count: two different shapes
      // can have the same number of triangles, and two identical ones always
      // hash the same.
      out[kind] = buildingVariants(kind, 2).map(({ walls, roof }) => {
        let h = 2166136261;
        for (const g of [walls, roof]) {
          if (!g) continue;
          const p = g.getAttribute("position").array;
          for (let i = 0; i < p.length; i += 1) {
            h ^= Math.round(p[i] * 4096) & 0xffff;
            h = Math.imul(h, 16777619) >>> 0;
          }
        }
        return h;
      });
    }
    return out;
  })(),
  // What the baked groups actually hold and where they actually are. Kept
  // because the E3 ribbons were in the scene, in the right place, with the
  // right triangle count, and invisible — and this is the probe that proved
  // the first three of those and left only the fourth to explain.
  streetBoxes: (() => {
    const out = [];
    for (const child of view.scene.children) {
      if (child.type !== "Group" || child.children.length === 0) continue;
      let tris = 0;
      const box = new THREE.Box3();
      for (const m of child.children) {
        if (!m.geometry) continue;
        tris += m.geometry.getAttribute("position").count / 3;
        m.geometry.computeBoundingBox();
        box.union(m.geometry.boundingBox.clone().applyMatrix4(child.matrixWorld));
      }
      if (tris > 0) out.push({ tris, visible: child.visible, min: box.min.toArray().map((v) => +v.toFixed(2)), max: box.max.toArray().map((v) => +v.toFixed(2)) });
    }
    return out.slice(0, 3);
  })(),
  estimate: stats.estimate,
  counted: stats.counted,
  shadows: stats.shadows,
  rebuilds: stats.rebuilds,
  // How many extra frames the street cache needed after the ones asked for. A
  // shot that settles for hundreds is a shot of a city that was still arriving.
  settleFrames,
  overBudget: stats.overBudget,
  pools: Object.entries(view.pools).filter(([, m]) => m.count > 0)
    .map(([n, m]) => `${n}:${m.count}x${m.geometry.getAttribute("position").count / 3}`)
    .join(" "),
};
// The renderer itself, so a slope gate can read the mesh it produced rather
// than guessing from a picture (slice V4).
globalThis.SHOT_VIEW = view;
// The state too, so a shot can be AIMED at something — "a residential street"
// is a query, not a coordinate somebody remembered (S9).
globalThis.SHOT_STATE = state;
globalThis.SHOT_PLACED = placed;
// A FILM (F2): `?film=<name>` loads `data/film/<name>.json` and hands the page
// a player. The tool drives it frame by frame — `window.FILM.frame(i, fps)` —
// because the caller owns the clock: a storyboard at one frame a second and a
// film at thirty are then the same camera, and the same on any machine.
const filmName = params.get("film");
if (filmName) {
  const { createTour } = await import("../client/debug/tour.js");
  const list = await (await fetch(`../data/film/${filmName}.json`)).json();
  let shown = view;
  const rebuild = async (styleName) => {
    shown.dispose?.();
    shown = createRenderer(canvas, state, { pixelRatio: 1, preserveDrawingBuffer: true,
      style: styleName, tier, life, mode, time, post: params.get("post") !== "0" });
    return shown;
  };
  const tour = createTour(list, view, { rebuild });
  // Life starts empty and FILLS: the traffic reached a hundred cars after ten
  // steps and the film's first second had an empty city in it. A fixed number
  // of steps before the first frame, so the first shot is as alive as the last
  // and the count is still a function of nothing but this code.
  //
  // Kept per RENDERER, not once: a style change builds a new renderer and a new
  // renderer has nobody in it, so the first frame of the painted orbit and the
  // first frame of the pull-back after it both came back with 0 cars — a film
  // in which the traffic vanishes on the cut.
  let warmedOn = null;
  globalThis.FILM = {
    name: list.name,
    title: list.title,
    seconds: tour.seconds,
    frames: (fps) => tour.frames(fps),
    /** Poses frame `i` and draws it, settling the street cache the way a shot
     * does — a frame of a city still arriving is the defect A115's round found
     * in the frozen screenshots. */
    frame: async (i, fps) => {
      const pose = await tour.frame(i, fps);
      // The road's hour follows the SHOT's hour, so a night street carries
      // night traffic rather than a midday rush under a dark sky (B4).
      const options = { ...drawOptions, dayPhase: params.has("hour")
        ? Number(params.get("hour")) : phaseForPreset(pose.time ?? time) };
      const now = (i * 1000) / fps;
      let stats;
      for (let f = 0; f < 8; f += 1) stats = tour.renderer.draw({ ...options, dt: 0, now });
      let settle = 0;
      while (settle < 400 && (stats?.streets?.built ?? 0) > 0) {
        stats = tour.renderer.draw({ ...options, dt: 0, now });
        settle += 1;
      }
      // Then ONE step of life, because `client/life/` takes its time from the
      // caller (ruling 037): settled with `dt: 0` alone, every frame has an
      // empty road and nobody on the pavement — which is what the first
      // storyboard was. The step is capped at a thirtieth so a storyboard's
      // one-second frames cannot throw a car through a junction, and it is a
      // function of the frame number alone, so the picture is the same on any
      // machine.
      if (life && warmedOn !== tour.renderer) {
        for (let f = 0; f < 24; f += 1) tour.renderer.draw({ ...options, dt: 1 / 30, frameMs: 16, now: f * 33 });
        warmedOn = tour.renderer;
      }
      if (life) stats = tour.renderer.draw({ ...options, dt: Math.min(1 / fps, 1 / 30), frameMs: 16, now: now + 16 });
      // POSED, and both crowds: `stats.peds` is the street crowd alone, and it
      // is 0 on a street the city crowd already holds people on (B7's two
      // crowds over one graph) — a film gate reading it would call a pavement
      // full of people empty.
      return { ...pose, settle, triangles: stats?.triangles ?? 0, cars: stats?.cars ?? 0,
        people: (stats?.pedsCityPosed ?? 0) + (stats?.peds ?? 0) };
    },
  };
}
globalThis.SHOT_READY = true;
</script>
</body>
</html>
