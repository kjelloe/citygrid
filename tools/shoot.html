<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>City Grid — headless render</title>
<script type="importmap">
{ "imports": { "three": "../vendor/three.module.js" } }
</script>
<style>
  html, body { margin: 0; background: #9fc7de; }
  #city { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="city"></canvas>
<script type="module">
// Builds a real city with the real engine, then renders it with the real
// renderer. No fixtures and no mock state: a screenshot of something the
// simulation did not actually produce would be worth nothing.
import * as THREE from "three";
import { buildingVariants, VARIANTS } from "../client/render/building-kit.js";
import { generateWorld } from "../engine/worldgen.js";
import { defaultOptions } from "../engine/options.js";
import { apply } from "../engine/reducer.js";
import { makeDeputy, deputyTurn } from "../engine/deputy.js";
import { CMD_JOIN, CMD_TICK } from "../engine/commands.js";
import { TICKS_PER_YEAR } from "../engine/constants.js";
import "../engine/build-commands.js";
import "../engine/development.js";
import "../engine/utilities.js";
import "../engine/economy.js";
import "../engine/civic.js";
import "../engine/fire.js";
import "../engine/disasters.js";
import "../engine/traffic.js";
import "../engine/history.js";
// The fixture every OTHER gate measures on. A deputy-built city is sparse —
// 89 buildings on a 48-tile map — and a slice about crowds cannot be looked at
// on a city with nobody in it (slice E7).
import { saturatedCity } from "./lib/saturated.mjs";
import { getConfig, setConfig } from "../client/world/config.js";
import { createRenderer } from "../client/render/scene.js";
import { setYawStep, zoomBy, focusOn, pitchBy } from "../client/render/camera.js";

const params = new URLSearchParams(location.search);
const seed = Number(params.get("seed") ?? 1003);
const years = Number(params.get("years") ?? 20);
const span = Number(params.get("span") ?? 0);
const yaw = Number(params.get("yaw") ?? 0);
// Degrees. The default is the camera's own start; a slope gate wants a low one,
// because relief seen from directly above is not relief (slice V4).
const pitchDeg = Number(params.get("pitch") ?? 0);

const canvas = document.getElementById("city");
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const size = Number(params.get("size") ?? 64);
const seats = Number(params.get("seats") ?? 1);
// `terrain` and `overlay` so the slope gate can shoot a hillside with every
// overlay on (slice V4).
const terrainStyle = params.get("terrain") ?? "rolling";
const overlay = params.get("overlay") ?? "";
// `dense=1` builds the saturated fixture instead: a grid every four tiles with
// zoning between it and four hundred ticks of growth.
const dense = params.get("dense") === "1";
let state;
if (dense) {
  state = saturatedCity({ size, seed, ticks: years * TICKS_PER_YEAR }).state;
} else {
  const world = generateWorld(defaultOptions({ seed, width: size, height: size, seats, waterStyle: "river", terrainStyle }));
  if (!world.ok) throw new Error("generation failed: " + world.reason);
  state = world.state;

  const deputies = [];
  for (let s2 = 1; s2 <= seats; s2 += 1) {
    apply(state, { type: CMD_JOIN, actor: s2, seat: s2, name: `Deputy ${s2}` });
    deputies.push(makeDeputy(s2, "expand"));
  }
  for (let tick = 1; tick <= years * TICKS_PER_YEAR; tick += 1) {
    apply(state, { type: CMD_TICK });
    if (tick % 6 === 0) for (const d of deputies) deputyTurn(state, d);
  }
}

// `pollute` fills the pollution layer with one value, which puts the WHOLE map
// in one overlay band without changing a single thing that is drawn (slice V7).
// Three shots at three values then differ only in the wash, which is what makes
// "are the bands still told apart once the ground shades them" measurable.
const pollute = Number(params.get("pollute") ?? -1);
if (pollute >= 0) state.tiles.pollution.fill(pollute);
// `sand=1` turns every dry tile to sand AFTER the city is grown, so the streets
// are where they were and the ground under them is not grass. The verge takes
// the ground's own colour (slice V7, A38) and green grass beside a road through
// a desert is exactly the bug that answer was written for.
if (params.get("sand") === "1") {
  for (let i = 0; i < state.tiles.terrain.length; i += 1) {
    const t = state.tiles.terrain[i];
    if (t !== 3 && t !== 4) state.tiles.terrain[i] = 6;
  }
}

// `relief=` overrides `reliefM` (ruling 038), so the two halves of a decision
// about how tall a hill should be can be shot from one harness (slice R3, A42).
const reliefParam = Number(params.get("relief") ?? 0);
if (reliefParam > 0) setConfig({ ...getConfig(), reliefM: reliefParam });
// `grade=0` is the street as it was before R3: the land under it. Anything else
// overrides `road.maxGrade`, so a decision about how steep a street may be can
// be shot rather than argued (A42).
const gradeParam = params.get("grade");
if (gradeParam !== null) {
  const cfg0 = getConfig();
  setConfig({ ...cfg0, road: { ...cfg0.road, maxGrade: Number(gradeParam) } });
}

// `traffic=N` sets the engine's commuter load on every paved tile. The
// saturated fixture pushes its buildings in directly and never runs a commuter
// pass, so it has no cars at all — and a shot of a traffic change with no
// traffic in it is the shape of instrument failure this project keeps finding
// (slice R4).
const trafficLoad = Number(params.get("traffic") ?? -1);
if (trafficLoad >= 0) {
  for (let i = 0; i < state.tiles.road.length; i += 1) {
    if (state.tiles.road[i] & 16) state.tiles.traffic[i] = trafficLoad;
  }
}

const style = params.get("style") ?? "plain";
// `tier` so the harness can shoot what each quality setting actually draws
// (slice V2). `pixelRatio` stays pinned at 1 whatever the tier says, or two
// shots of the same city would differ in size rather than in detail.
const tier = params.get("tier") ?? "high";
// `life=0` freezes the traffic where it settled, so two shots of one city are
// the same picture (slice V1).
const life = params.get("life") === "1";
// `mode=ortho|city` so the review can diff the orthographic picture before and
// after V5 and see that it did not move.
const mode = params.get("mode") ?? "ortho";
// `time=day|sunset|night` (slice E6). The hour is a preset, and the shot takes
// it at once rather than fading in — `frames` then settles the cache.
const time = params.get("time") ?? "day";
// `post=0` turns the style's post pass off without changing anything else,
// which is how the ink is shown to be a finish rather than the style (P2).
const view = createRenderer(canvas, state, { pixelRatio: 1, preserveDrawingBuffer: true, style, tier, life, mode, time, post: params.get("post") !== "0" });
setYawStep(view.view, yaw);
if (pitchDeg > 0) pitchBy(view.view, pitchDeg * (Math.PI / 180) - view.view.pitch);
if (span > 0) {
  view.view.span = span;
  zoomBy(view.view, 1);
}
// Frame where the city actually is, rather than the middle of the map — the
// deputy often builds off-centre and a screenshot of empty fields proves
// nothing.
const focusX = Number(params.get("fx") ?? -1);
const focusY = Number(params.get("fy") ?? -1);
if (focusX >= 0 && focusY >= 0) {
  focusOn(view.view, focusX, focusY);
} else if (state.buildings.length > 0) {
  let sx = 0; let sy = 0; let n = 0;
  for (const b of state.buildings) {
    if (b.zone === 0) continue;
    sx += b.x; sy += b.y; n += 1;
  }
  if (n > 0) focusOn(view.view, sx / n, sy / n);
}
// Street mode (slice E4): `street=x,z` drops the walker at a tile and looks
// along `yaw`. The camera is the walker, so the shot is what a player sees.
const streetAt = params.get("street");
if (streetAt) {
  const [sx, sz] = streetAt.split(",").map(Number);
  if (!view.enterStreet(sx, sz)) throw new Error("no street to stand on");
  view.walker.look(yaw * (Math.PI / 2) - view.walker.pose.yaw, pitchDeg * (Math.PI / 180));
}
const reduced = params.get("reduced") === "1";
const budgetParam = Number(params.get("budget") ?? 0);
// `streetChunks` so the L3 gate can shoot the baked street without needing the
// High tier's full budget (slice E3).
const streetChunks = Number(params.get("streets") ?? -1);
// The street cache bakes one chunk a frame, so a one-frame shot of an L3 city
// shows a city with one chunk of street in it (slice E3).
const frames = Number(params.get("frames") ?? 1);
const drawOptions = {
  streetChunks: streetChunks >= 0 ? streetChunks : undefined,
  props: !reduced, trees: !reduced,
  // `shadows=0` to tell a toon ramp's banding apart from a cast shadow.
  shadows: params.get("shadows") !== "0",
  budget: budgetParam > 0 ? budgetParam : undefined,
  overlay: overlay || undefined,
  // `territory=1` paints every building in its owner's colour (slice V7, A44).
  // The baked chunks honour it too now, so this is the shot that shows the near
  // half of the city agreeing with the far half.
  territory: params.get("territory") === "1",
};
let stats;
// **`life=1` needs a delta or it is `life=0` with extra steps.** `client/life/`
// takes its time from the caller (ruling 037), and this loop passed neither
// `dt` nor `frameMs` — so every screenshot this harness has ever taken had no
// moving car and nobody on the pavement, `life=1` included. Found in D4, when
// the compare sheet came back empty beside a reference full of vehicles.
//
// `frameMs` is 16 whatever the clock really says: the governor must stay idle
// for a shot, or a slow software rasteriser degrades the picture we are trying
// to look at, and the picture would be of the governor.
const step = life ? { dt: 1 / 60, frameMs: 16 } : {};
for (let f = 0; f < frames; f += 1) stats = view.draw({ ...drawOptions, ...step, now: f * 16 });

const firstChunk = view.terrain.chunks[0];
const pos = firstChunk.mesh.geometry.getAttribute("position");
globalThis.SHOT_REPORT = {
  style,
  seed, years,
  population: state.population,
  buildings: state.buildings.length,
  chunksRebuilt: stats.chunksRebuilt,
  corridors: stats.corridors,
  lots: stats.lots,
  instances: stats.instances,
  // From the STATS, not from `renderer.info`: with a post pass the counter has
  // been reset by the full-screen quad by the time this runs, and every shot of
  // a post-processed style has reported "1 draw, 2 triangles" (P2).
  drawCalls: stats.drawCalls ?? view.renderer.info.render.calls,
  triangles: stats.triangles ?? view.renderer.info.render.triangles,
  lod: stats.lod,
  tilePixels: stats.tilePixels,
  budget: stats.budget,
  chunkPlans: stats.chunkPlans,
  chunkTiers: stats.chunkTiers,
  streets: stats.streets,
  time: stats.time,
  night: stats.night,
  lamps: stats.lamps,
  peds: stats.peds,
  pedsHeld: stats.pedsHeld,
  nav: stats.nav,
  lampsHeld: stats.lampsHeld,
  cars: stats.cars,
  variants: VARIANTS,
  // How many of the garden pools were actually placed (slice V6). A pool that
  // is silently empty looks exactly like a pool whose conditions were not met,
  // which is the lesson E6 paid for.
  garden: { lawn: view.pools.lawn?.count ?? -1, hedge: view.pools.hedge?.count ?? -1, path: view.pools.path?.count ?? -1 },
  mode,
  relief: getConfig().reliefM,
  maxGrade: getConfig().road.maxGrade,
  spanUsed: view.view.span,
  maxH: view.model.maxHeight,
  steepestStreet: view.model.steepestStreet,
  // Every category's variants, as triangle counts (slice V6). A variant the kit
  // does not build comes out identical to another, which is a city of clones
  // and a green suite; node cannot see this because `building-kit.js` imports
  // three.
  kit: (() => {
    const out = {};
    for (const kind of ["residential", "commercial", "industrial", "civic"]) {
      // `{ walls, roof }` per variant — the roof is its own geometry so it can
      // take the roof colour.
      // A hash of the POSITIONS, not a triangle count: two different shapes
      // can have the same number of triangles, and two identical ones always
      // hash the same.
      out[kind] = buildingVariants(kind, 2).map(({ walls, roof }) => {
        let h = 2166136261;
        for (const g of [walls, roof]) {
          if (!g) continue;
          const p = g.getAttribute("position").array;
          for (let i = 0; i < p.length; i += 1) {
            h ^= Math.round(p[i] * 4096) & 0xffff;
            h = Math.imul(h, 16777619) >>> 0;
          }
        }
        return h;
      });
    }
    return out;
  })(),
  // What the baked groups actually hold and where they actually are. Kept
  // because the E3 ribbons were in the scene, in the right place, with the
  // right triangle count, and invisible — and this is the probe that proved
  // the first three of those and left only the fourth to explain.
  streetBoxes: (() => {
    const out = [];
    for (const child of view.scene.children) {
      if (child.type !== "Group" || child.children.length === 0) continue;
      let tris = 0;
      const box = new THREE.Box3();
      for (const m of child.children) {
        if (!m.geometry) continue;
        tris += m.geometry.getAttribute("position").count / 3;
        m.geometry.computeBoundingBox();
        box.union(m.geometry.boundingBox.clone().applyMatrix4(child.matrixWorld));
      }
      if (tris > 0) out.push({ tris, visible: child.visible, min: box.min.toArray().map((v) => +v.toFixed(2)), max: box.max.toArray().map((v) => +v.toFixed(2)) });
    }
    return out.slice(0, 3);
  })(),
  estimate: stats.estimate,
  counted: stats.counted,
  shadows: stats.shadows,
  rebuilds: stats.rebuilds,
  overBudget: stats.overBudget,
  pools: Object.entries(view.pools).filter(([, m]) => m.count > 0)
    .map(([n, m]) => `${n}:${m.count}x${m.geometry.getAttribute("position").count / 3}`)
    .join(" "),
};
// The renderer itself, so a slope gate can read the mesh it produced rather
// than guessing from a picture (slice V4).
globalThis.SHOT_VIEW = view;
globalThis.SHOT_READY = true;
</script>
</body>
</html>
