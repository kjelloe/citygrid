# /etc/nginx/sites-available/citygrid — a template, HTTP-only on purpose.
#
# **Ship it HTTP-only and let certbot add the TLS half.** A `listen 443 ssl`
# block with no certificate yet fails the WHOLE nginx config, and certbot runs
# `nginx -t` before it does anything — so it cannot fix what blocks it.
#
# **Link it the safe way**, never `ln -sf` before the test:
#
#     sudo ln -s /etc/nginx/sites-available/citygrid /etc/nginx/sites-enabled/citygrid
#     sudo nginx -t || sudo rm /etc/nginx/sites-enabled/citygrid
#
# `ln -sf` then `nginx -t` leaves a broken file live in sites-enabled: nginx
# keeps serving the old config from memory so nothing looks wrong, and every
# FUTURE reload on the box fails — a neighbour's deploy, certbot's renewal.
# (`../Fireline/deploy-new-sibling-game-in-box-dos-and-donts.md`, the part that
# bit hardest.)

# **Our own map, under our own name.** The classic WebSocket snippet references
# `$connection_upgrade`, which on a shared box may or may not be defined when
# this file parses — and redeclaring the shared one is itself a config error.
# A unique name is the only form that is safe both ways.
map $http_upgrade $citygrid_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name citygrid.kjell.today;

    # No `http2` here: it is a per-socket property and the box already logs
    # "protocol options redefined" from one site declaring it. Inherit it.

    location / {
        proxy_pass http://127.0.0.1:8133;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $citygrid_connection_upgrade;
        proxy_set_header Host $host;
        # TRUST_PROXY=1 in the unit is what makes the server read this, and it
        # is a header a client can send, so the two have to agree.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        # A room's socket is idle between frames when the clock is paused, and
        # a phone's radio waking from power-save stalls longer than any default.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # The box-wide convention: one path a monitoring sweep hits across every
    # port on the machine. `/health` is an alias of the same handler.
    location = /healthz {
        proxy_pass http://127.0.0.1:8133/healthz;
        access_log off;
    }
}
